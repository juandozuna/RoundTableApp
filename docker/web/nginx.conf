# Serves the Flutter web build (hash routing: deep links are `/#/...`, so only `/` is requested).
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Flutter's JS/wasm/json assets are large and compress well.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/javascript application/javascript application/json
    application/wasm image/svg+xml application/manifest+json font/ttf font/otf;

  # Local/staging: always revalidate (ETag) so a rebuilt bundle is picked up immediately.
  add_header Cache-Control "no-cache" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Real files are served as is; anything else (never hit with hash routing) falls back to the app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # A missing asset must be a real 404, not index.html (it hides broken worker/wasm paths).
  location ~* \.(js|mjs|wasm|map|json|png|jpg|jpeg|svg|ico|ttf|otf|woff2?)$ {
    try_files $uri =404;
  }
}
