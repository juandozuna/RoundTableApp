<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L2 · Puerta única — Gold Roundtables</title>
<style>
:root{
  --page:#08060f;--bg:#0E0B1A;--bg2:#14102A;--surf:#1A1530;--surf2:#251E45;--line:#3A3166;
  --ink:#F4F1FF;--mut:#A9A1CC;--acc:#A48BFF;--accb:#6F4DFF;--accg:#8654F7;--bd:#7A70B5;--onacc:#fff;
  --lime:#3DE08A;--amber:#FFB547;--off:#8F98BC;--mag:#FF4F9A;--err:#FF7A7A;--sky:#5CC8FF;--cyan:#2DD4D4;--lilac:#C7B6FF;
  --onc:#0B0A14;--glow:rgba(139,108,255,.28);--shadow:0 20px 60px rgba(0,0,0,.55);
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --page:#E4DEFA;--bg:#F3F0FF;--bg2:#E9E4FF;--surf:#FFFFFF;--surf2:#ECE7FF;--line:#C9BFF0;
  --ink:#1B1438;--mut:#554C7E;--acc:#5B3FE0;--accb:#5B3FE0;--accg:#7a4df0;--bd:#7C72B8;--onacc:#fff;
  --lime:#096B3A;--amber:#8A5200;--off:#515A80;--mag:#B0165F;--err:#B3261E;--sky:#095F8F;--cyan:#086363;--lilac:#5B3FE0;
  --onc:#fff;--glow:rgba(91,63,224,.18);--shadow:0 20px 50px rgba(60,40,140,.25)}}
:root[data-theme=light]{
  --page:#E4DEFA;--bg:#F3F0FF;--bg2:#E9E4FF;--surf:#FFFFFF;--surf2:#ECE7FF;--line:#C9BFF0;
  --ink:#1B1438;--mut:#554C7E;--acc:#5B3FE0;--accb:#5B3FE0;--accg:#7a4df0;--bd:#7C72B8;--onacc:#fff;
  --lime:#096B3A;--amber:#8A5200;--off:#515A80;--mag:#B0165F;--err:#B3261E;--sky:#095F8F;--cyan:#086363;--lilac:#5B3FE0;
  --onc:#fff;--glow:rgba(91,63,224,.18);--shadow:0 20px 50px rgba(60,40,140,.25)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.35}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ic{flex:none;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3,p{margin:0}
/* reviewer */
.rv{max-width:1500px;margin:0 auto;padding:14px 18px 6px}
.rv-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.rv h1{font-size:22px;font-weight:900;letter-spacing:-.01em}.rv h1 b{color:var(--acc)}
.rv .concept{color:var(--mut);font-size:14px;max-width:900px}
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:12px 0 8px}
.ctl label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mut)}
.seg2{display:inline-flex;border:2px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--surf)}
.seg2 button{border:0;background:transparent;padding:0 14px;min-height:44px;font-weight:800;font-size:14px}
.seg2 button[aria-pressed=true]{background:var(--accb);color:var(--onacc)}
.seg2 button.offb[aria-pressed=true]{background:var(--off);color:var(--onc)}
.rbtn{min-height:44px;padding:0 14px;border-radius:14px;border:2px solid var(--bd);background:var(--surf);font-weight:700;font-size:14px}
.rbtn:hover{border-color:var(--acc)}
.sel{min-height:44px;border-radius:14px;border:2px solid var(--bd);background:var(--surf);padding:0 10px;font-weight:700;font-size:14px;max-width:100%}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.refs{font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);padding:8px 0 0;margin-top:6px}
.refs b{color:var(--ink)}
.refs a{display:inline-block;margin:2px 4px 2px 0;padding:2px 9px;border-radius:999px;background:var(--surf);border:1px solid var(--line);color:var(--ink);font-weight:600;text-decoration:none}
.refs a:hover{border-color:var(--acc)}
.stagew{max-width:1500px;margin:0 auto;padding:10px 18px 30px;display:flex;justify-content:center;overflow-x:auto}
.frame{position:relative;width:390px;max-width:100%;height:800px;border-radius:44px;border:10px solid #05040b;box-shadow:var(--shadow),0 0 0 2px var(--line);overflow:hidden;background:var(--bg);flex:none}
.frame.t{width:820px;height:780px;border-radius:28px;border-width:12px}
.frame.d{width:1280px;height:760px;border-radius:12px;border-width:2px}
.chrome{display:none;height:34px;background:var(--bg2);border-bottom:1px solid var(--line);align-items:center;gap:8px;padding:0 12px;font-size:12px;color:var(--mut)}
.frame.d .chrome{display:flex}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.chrome .url{margin-left:12px;flex:1;max-width:420px;background:var(--surf);border-radius:8px;padding:3px 10px}
.fin{position:absolute;inset:0;display:flex;flex-direction:column}
.app{container-type:inline-size;container-name:app;position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.app::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 50% at 50% -10%,var(--glow),transparent 60%);pointer-events:none}
.app>*{position:relative}
.sbar{display:flex;justify-content:space-between;padding:8px 22px 2px;font-size:12px;font-weight:800;flex:none}
.frame.t .sbar,.frame.d .sbar{display:none}
/* buttons */
.btn{width:100%;min-height:54px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--accb),var(--accg));color:var(--onacc);font-weight:900;font-size:16.5px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 22px var(--glow)}
.btn:disabled,.btn[aria-disabled=true]{background:var(--surf2);color:var(--mut);box-shadow:none;cursor:not-allowed}
.btn.sec{background:var(--surf2);color:var(--ink);box-shadow:none;border:2px solid var(--bd);font-size:15px;min-height:48px}
.btn.ghost{background:transparent;color:var(--acc);box-shadow:none;font-size:15px;min-height:46px}
.btn.dng{background:transparent;color:var(--err);border:2px solid var(--err);box-shadow:none;font-size:15px;min-height:48px}
.btn.sm{width:auto;min-height:44px;font-size:14px;padding:0 14px;border-radius:14px}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.prov{width:100%;min-height:54px;border-radius:16px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:16px;margin-top:10px}
.prov.g{background:#fff;color:#1f1f1f;border-color:#dadce0}
.prov.a{background:var(--ink);color:var(--bg)}
.prov.f{background:#1763d6;color:#fff}
.prov:disabled{opacity:.55;cursor:not-allowed}
.prov:hover:not(:disabled){filter:brightness(1.07)}
.lnk{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:16px;border:2px solid var(--bd);background:var(--surf);font-weight:800;font-size:15px;margin-top:10px}
.lnk:hover{border-color:var(--acc)}
.ibtn{min-width:44px;min-height:44px;border-radius:14px;border:2px solid var(--bd);background:var(--surf2);display:inline-grid;place-items:center}
.ibtn:hover{border-color:var(--acc)}
.kick{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
/* feedback */
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;border:1.5px solid var(--c,var(--line));color:var(--ink);background:color-mix(in srgb,var(--c,var(--line)) 14%,transparent)}
.pill .ic{color:var(--c)}
.p-ok{--c:var(--lime)}.p-pend{--c:var(--amber)}.p-late{--c:var(--mag)}.p-off{--c:var(--off)}.p-err{--c:var(--err)}.p-acc{--c:var(--acc)}
.pill.p-pend{border-style:dotted}.pill.p-off{border-style:dashed}.pill.p-err{border-style:double;border-width:4px;padding:2px 9px}
.msg{display:flex;gap:10px;border-radius:16px;padding:10px 12px;margin-top:12px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);font-size:13.5px}
.msg .ic{color:var(--c);margin-top:2px}.msg b{font-weight:800}.msg small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.m-err{--c:var(--err)}.m-warn{--c:var(--amber)}.m-info{--c:var(--acc)}.m-ok{--c:var(--lime)}
.offline{display:flex;gap:10px;align-items:center;margin:0;padding:9px 14px;background:color-mix(in srgb,var(--off) 16%,var(--bg));border-bottom:1.5px solid var(--off);font-size:13px;font-weight:700;flex:none}
.offline .ic{color:var(--off)}.offline button{margin-left:auto;min-height:44px;border:0;background:transparent;color:var(--acc);font-weight:800;padding:0 8px}
.toast{position:absolute;left:14px;right:14px;top:44px;z-index:50;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .25s ease;display:flex;gap:8px;align-items:center}
@container app (min-width:700px){.toast{left:auto;right:20px;top:70px;max-width:380px}}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.busy{position:absolute;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;text-align:center;font-weight:800}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);animation:spin .9s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* avatar */
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:900;flex:none;width:var(--s,40px);height:var(--s,40px);font-size:calc(var(--s,40px)*.36);letter-spacing:.02em}
.av.sq{border-radius:12px}
/* flow (gate) layout */
.flow{flex:1;min-height:0;display:flex;flex-direction:column}
.brandpane{display:none}
.pane{flex:1;overflow-y:auto;padding:8px 18px 16px;display:flex;flex-direction:column}
.pane>.inner{width:100%;max-width:460px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.fbar{display:flex;align-items:center;gap:10px;min-height:52px;flex:none;margin-bottom:4px}
.fbar .t{font-weight:900;font-size:15px}
.lock{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--accb),var(--accg));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px var(--glow)}
.wm{font-weight:900;font-size:17px;letter-spacing:-.01em;line-height:1}.wm small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:3px;font-weight:800}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.sub{color:var(--mut);font-size:14.5px;margin-top:6px;font-weight:500}
.steps{display:flex;gap:6px;align-items:center;margin:2px 0 10px}
.steps i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--acc)}.steps i.cur{background:linear-gradient(90deg,var(--accb),var(--accg))}
.steps span{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;margin-left:4px}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--mut);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fine{font-size:12px;color:var(--mut);text-align:center;margin-top:auto;padding-top:14px}
@container app (min-width:700px){
  .flow{flex-direction:row}
  .brandpane{display:flex;flex-direction:column;justify-content:space-between;flex:0 0 42%;padding:34px 36px;background:linear-gradient(160deg,var(--surf2),var(--bg2) 60%);border-right:1px solid var(--line);overflow:hidden}
  .brandpane h2{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1}
  .brandpane h2 em{font-style:normal;color:var(--acc)}
  .brandpane p{color:var(--mut);margin-top:14px;font-size:16px;max-width:360px}
  .pane{justify-content:center;padding:28px 40px}
  .pane>.inner{flex:0 1 auto}
  .lock.mobonly{display:none}
  .fine{margin-top:20px}
}
.seatrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.seat{width:30px;height:30px;border-radius:50%;border:3px solid var(--lime);background:color-mix(in srgb,var(--lime) 18%,transparent);display:grid;place-items:center}
.seat.pe{border-style:dashed;border-color:var(--amber);background:transparent}
.seat.me{border-color:var(--acc);background:var(--acc);color:#fff;box-shadow:0 0 0 4px var(--glow)}
.seat.em{border-style:dotted;border-color:var(--off);background:transparent}
.seat.full{border-color:var(--err)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--lime);display:inline-block}
.legend i.pe{border-style:dashed;border-color:var(--amber)}.legend i.me{border-color:var(--acc);background:var(--acc)}.legend i.em{border-style:dotted;border-color:var(--off)}
/* code input */
.codew{position:relative;margin-top:18px}
.codein{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;z-index:2;cursor:text}
.cells{display:flex;gap:8px;justify-content:center}
.cell{flex:1;max-width:58px;aspect-ratio:.82;border-radius:14px;border:2px solid var(--bd);background:var(--surf);display:grid;place-items:center;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.cell.act{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
.cell.bad{border-color:var(--err);animation:shk .3s}
.cell.ok{border-color:var(--lime)}
.codew:focus-within .cell.act::after{content:"";width:2px;height:28px;background:var(--acc);animation:blk 1s steps(2) infinite}
@keyframes blk{50%{opacity:0}}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.chipsrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{min-height:44px;padding:0 12px;border-radius:999px;border:1.5px solid var(--bd);background:var(--surf);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--accb);border-color:var(--accb);color:var(--onacc)}
.chip b{font-variant-numeric:tabular-nums}
.chip.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em}
/* camera */
.cam{position:relative;border-radius:24px;background:#000;aspect-ratio:1/1;max-height:340px;margin:10px auto 0;width:100%;overflow:hidden;display:grid;place-items:center;color:#fff}
.cam .cr{position:absolute;width:44px;height:44px;border:4px solid #fff;border-radius:10px}
.cam .tl{left:18%;top:18%;border-right:0;border-bottom:0}.cam .tr{right:18%;top:18%;border-left:0;border-bottom:0}
.cam .bl{left:18%;bottom:18%;border-right:0;border-top:0}.cam .br{right:18%;bottom:18%;border-left:0;border-top:0}
.cam .ln{position:absolute;left:18%;right:18%;height:3px;background:var(--lime);box-shadow:0 0 14px var(--lime);animation:sweep 2.2s ease-in-out infinite alternate}
@keyframes sweep{from{top:20%}to{top:78%}}
.cam .txt{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12.5px;font-weight:700;color:#eee}
.osdlg{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:20px}
.osdlg>div{background:#f2f2f7;color:#111;border-radius:16px;width:100%;max-width:290px;text-align:center;overflow:hidden}
.osdlg h3{font-size:16px;padding:16px 16px 4px}.osdlg p{font-size:13px;padding:0 16px 14px;color:#333}
.osdlg .r{display:flex;border-top:1px solid #c6c6c8}.osdlg .r button{flex:1;min-height:48px;border:0;background:transparent;color:#0a5fd0;font-weight:700;font-size:16px}
.osdlg .r button+button{border-left:1px solid #c6c6c8}
/* preview */
.pv{background:var(--surf);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}
.pv .who{display:flex;align-items:center;gap:12px}
.pv dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14px}
.pv dt{color:var(--mut);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;align-self:center}
.pv dd{margin:0;font-weight:700}
.big-ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);margin:18px auto 12px}
.res{text-align:center}.res .h1{font-size:26px}
.res .sub{max-width:340px;margin-left:auto;margin-right:auto}
/* form */
.fld{margin-top:12px}
.fld label,.fld .fl{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.fld label i,.fl i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600}
.inp{width:100%;min-height:50px;border-radius:14px;border:2px solid var(--bd);background:var(--surf);padding:0 14px;font-size:16px;font-weight:600}
.inp:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 4px var(--glow)}
.inp[aria-invalid=true]{border-color:var(--err)}
.inp:disabled{opacity:.6}
.ferr{display:flex;gap:6px;align-items:center;color:var(--err);font-size:13px;font-weight:700;margin-top:5px}
.fhint{font-size:12.5px;color:var(--mut);margin-top:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phrow{display:grid;grid-template-columns:128px 1fr;gap:8px}
.radio{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:56px;padding:10px 12px;border-radius:16px;border:2px solid var(--bd);background:var(--surf);margin-top:8px}
.radio[aria-checked=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surf));box-shadow:0 0 0 3px var(--glow)}
.radio[aria-disabled=true]{opacity:.65;border-style:dashed;cursor:not-allowed}
.radio .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);flex:none;margin-top:2px;display:grid;place-items:center}
.radio[aria-checked=true] .dot{border-color:var(--acc);background:var(--acc)}
.radio b{display:block;font-size:15px}.radio small{color:var(--mut);font-size:12.5px;font-weight:500}
.dockb{flex:none;padding:10px 16px 14px;background:linear-gradient(180deg,transparent,var(--bg) 24%);display:flex;gap:8px;flex-direction:column}
/* shell */
.shell{flex:1;min-height:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;flex:none;border-bottom:1px solid var(--line);min-height:60px}
.top .sp{flex:1}
.ctxchip{display:flex;align-items:center;gap:9px;min-height:48px;padding:3px 12px 3px 4px;border-radius:999px;border:2px solid var(--bd);background:var(--surf);text-align:left;max-width:calc(100% - 60px)}
.ctxchip:hover:not(.static){border-color:var(--acc)}
.ctxchip .tx{min-width:0;line-height:1.1}
.ctxchip .tx small{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.ctxchip .tx b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxchip.static{border-style:dashed;cursor:default}
.mainw{flex:1;min-height:0;display:flex;flex-direction:column}
.side{display:none}
.main{flex:1;overflow-y:auto;padding:14px 16px 20px}
.main>.in{max-width:980px;margin:0 auto}
.bnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--bg2);flex:none;padding-bottom:6px}
.bnav button{border:0;background:transparent;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;color:var(--mut)}
.bnav button[aria-current=page]{color:var(--acc)}
.bnav button[aria-current=page] .ic{filter:drop-shadow(0 0 6px var(--glow))}
.pt{font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1.05}

function ctxs(){return S.base.map(i=>CTX[i]).concat(S.extra)}
function cur(){return ctxs().find(c=>c.id===S.ctxId)||ctxs()[0]||null}
function can(){const c=cur();return c?CAN[c.role]:[]}
const NETSCR=['gate','code','qr','preview','profile'];
const $=id=>document.getElementById(id);

/* ============ views ============ */
const MARK='<span class="mark" aria-hidden="true">'+ic('table',22)+'</span>';
function brandLock(){return '<div class="lock mobonly">'+MARK+'<div class="wm">Gold Roundtables<small>Mesas de valores</small></div></div>'}
function msg(k,ico,t,sm){return '<div class="msg m-'+k+'" role="'+(k==='err'?'alert':'status')+'">'+ic(ico,18)+'<div><b>'+t+'</b>'+(sm?'<small>'+sm+'</small>':'')+'</div></div>'}
function seats(tb,mode){ // mode: 'join' marks me; 'inv' shows pending
 let h='';const solid=tb.used-tb.pend;
 for(let i=0;i<tb.max;i++){
  if(i<solid)h+='<span class="seat'+(tb.used>=tb.max&&mode==='inv'?' full':'')+'" title="'+(i===0?'Facilitador':'Integrante')+'">'+(i===0?ic('crown',15):'')+'</span>';
  else if(mode==='join'&&i===solid)h+='<span class="seat me" title="Tu lugar">'+ic('user',15)+'</span>';
  else if(i<tb.used)h+='<span class="seat pe" title="Invitación pendiente"></span>';
  else if(mode==='inv'&&i===tb.used)h+='<span class="seat em" title="Lugar libre"></span>';
  else h+='<span class="seat em" title="Lugar libre"></span>'}
 return '<div class="seatrow" role="img" aria-label="'+tb.used+' de '+tb.max+' lugares ocupados, el facilitador cuenta">'+h+'</div>'+
 '<div class="legend"><span><i></i>Integrante</span><span><i class="pe"></i>Invitado</span>'+(mode==='join'?'<span><i class="me"></i>Tú</span>':'')+'<span><i class="em"></i>Libre</span></div>'}
function steps(n){const L=['Código','Confirmar','Perfil'];return '<div class="steps" role="img" aria-label="Paso '+n+' de 3: '+L[n-1]+'">'+L.map((_,i)=>'<i class="'+(i+1<n?'on':i+1===n?'cur':'')+'"></i>').join('')+'<span>'+n+'/3 · '+L[n-1]+'</span></div>'}
function flow(inner,o){o=o||{};
 return '<div class="flow"><aside class="brandpane"><div class="lock" style="margin:0">'+MARK+'<div class="wm">Gold Roundtables<small>Mesas de valores</small></div></div><div><h2>Una sola puerta para <em>todas</em> tus mesas.</h2><p>Entra con Google, Apple o Facebook. Si te invitaron, usa tu código o escanea el QR y confirma a qué te unes.</p></div><div class="legend" style="margin:0"><span>Iglesia Casa del Altísimo</span><span>·</span><span>Organizaciones y mesas</span></div></aside>'+
 '<section class="pane"><div class="inner">'+(o.back?'<div class="fbar"><button class="ibtn" data-act="'+o.back+'" aria-label="Volver">'+ic('back',20)+'</button><span class="t">'+(o.title||'')+'</span></div>':'')+(o.step?steps(o.step):'')+inner+'</div></section></div>'}
function provBtns(prefix,dis){return ['google','apple','facebook'].map(k=>'<button class="prov '+PROVS[k].cls+'" data-act="signin" data-p="'+k+'"'+(dis?' disabled':'')+'>'+PROVS[k].svg+'<span>'+prefix+' '+PROVS[k].n+'</span></button>').join('')}

function vGate(){
 return flow(brandLock()+'<h1 class="h1">Entra a tu mesa</h1><p class="sub">Usa la cuenta que ya tienes. Sin contraseñas nuevas.</p>'+
 (S.gateMsg?msg('warn','info',S.gateMsg.t,S.gateMsg.s):'')+
 '<div style="margin-top:14px">'+provBtns('Continuar con')+'</div><div class="or">¿Te invitaron?</div>'+
 '<button class="lnk" data-act="toCode">'+ic('list',20)+'Tengo un código de invitación</button><button class="lnk" data-act="toQr">'+ic('qr',20)+'Escanear QR</button>'+
 '<p class="fine">Solo Google, Apple o Facebook. No se usa SMS ni teléfono para entrar.</p>')}

function codeCells(){const v=S.codeVal;let h='';for(let i=0;i<6;i++)h+='<span class="cell'+(i===v.length&&v.length<6?' act':'')+(S.codeErr&&v.length===6?' bad':'')+'">'+esc(v[i]||'')+'</span>';return h}
function vCode(){
 const dis=S.attempts>=5;
 return flow('<h1 class="h1">Escribe tu código</h1><p class="sub">Son 6 caracteres. Te lo envió quien te invitó, por WhatsApp o en persona.</p>'+
 '<form data-form="code"><div class="codew"><input id="codeIn" class="codein" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Código de invitación, 6 caracteres" aria-describedby="codeHelp" value="'+esc(S.codeVal)+'"'+(dis?' disabled':'')+'><div class="cells" id="cells">'+codeCells()+'</div></div>'+
 '<div id="codeHelp" aria-live="polite">'+(S.codeErr?'<div class="ferr" role="alert">'+ic('alert',16)+S.codeErr+'</div>':'<p class="fhint" style="text-align:center">Sin distinguir mayúsculas. Puedes pegarlo.</p>')+'</div>'+
 (dis?msg('err','lock','Demasiados intentos','Espera 60 segundos o escanea el QR.'):'')+
 '<button class="btn" style="margin-top:16px" type="submit"'+(dis||!R.online?' aria-disabled="true"':'')+'>Continuar</button></form>'+
 '<button class="lnk" data-act="toQr">'+ic('qr',20)+'Prefiero escanear el QR</button>'+
 '<div style="margin-top:18px"><div class="kick">Códigos de prueba (prototipo)</div><div class="chipsrow">'+Object.keys(CODES).map(k=>'<button type="button" class="chip mono" data-act="fillcode" data-c="'+k+'">'+k+'</button>').join('')+'<button type="button" class="chip mono" data-act="fillcode" data-c="MESA4Z">MESA4Z</button></div></div>',{back:'toGate',title:'Código de invitación',step:1})}

function vQr(){
 let body;
 if(S.cam==='denied')body='<div class="cam" style="background:var(--surf);color:var(--ink);border:2px dashed var(--bd)"><div style="padding:18px;text-align:center">'+ic('camoff',40)+'<h3 style="margin-top:8px;font-size:18px">No podemos usar la cámara</h3><p class="fhint">El permiso está desactivado. Actívalo en Ajustes del teléfono o escribe el código.</p></div></div><button class="btn" style="margin-top:14px" data-act="toCode">Escribir el código</button><button class="lnk" data-act="camask">'+ic('refresh',18)+'Volver a pedir permiso</button>';
 else body='<div class="cam" aria-label="Vista de cámara simulada"><span class="cr tl"></span><span class="cr tr"></span><span class="cr bl"></span><span class="cr br"></span>'+(S.cam==='on'?'<span class="ln"></span>':'')+'<span class="txt">'+(S.cam==='on'?'Apunta al QR de tu invitación':'Esperando permiso…')+'</span></div>'+
 '<div class="card" style="margin-top:12px"><div class="kick">Prototipo · simular lectura</div><div class="shgrid"><button class="lnk" data-act="qrok">'+ic('check',18)+'QR válido</button><button class="lnk" data-act="qrbad">'+ic('x',18)+'QR de otra app</button></div></div><button class="lnk" data-act="toCode">'+ic('list',20)+'Escribir el código</button>';
 return flow('<h1 class="h1">Escanea el QR</h1><p class="sub">Quien te invitó puede mostrarte el QR en su teléfono.</p>'+body,{back:'toGate',title:'Escanear QR',step:1})}

function vPreview(){
 const v=S.inv,tb=v.table?S.tables.find(t=>t.n===v.table):null;
 const act=S.ident?'<button class="btn" style="margin-top:16px" data-act="join">Unirme como '+v.role+'</button><p class="fhint" style="text-align:center">Sesión iniciada con '+PROVS[S.ident.provider].n+'</p>':
  '<div class="kick" style="margin-top:16px">Confirma con tu cuenta · se vincula a esta invitación</div>'+provBtns('Unirme con');
 return flow('<h1 class="h1">Esto es a lo que te unes</h1><p class="sub">Revisa los datos antes de vincular tu cuenta.</p>'+
 '<div class="pv"><div class="who">'+av(v.inviter,48)+'<div><div class="kick">Te invitó</div><b style="font-size:17px">'+esc(v.inviter)+'</b> <span class="fhint">· '+v.irole+'</span></div></div>'+
 '<dl><dt>Organización</dt><dd>'+esc(v.org)+'</dd>'+(v.table?'<dt>Mesa</dt><dd>'+esc(v.table)+'</dd>':'')+'<dt>Tu rol</dt><dd><span class="pill p-acc">'+ic('user',14)+v.role+'</span></dd><dt>Invitada/o</dt><dd>'+esc(v.first+' '+v.last)+'</dd><dt>Vence en</dt><dd>'+v.left+'</dd></dl>'+
 (tb?'<div style="margin-top:14px">'+seats(tb,'join')+'<p class="fhint">Mesa de 3 a 9 personas; el facilitador cuenta como un lugar.</p></div>':'')+'</div>'+
 (!R.online?msg('warn','wifioff','Necesitas internet para unirte'):'')+act,{back:'toCode',title:'Vista previa',step:2})}

const RES={
 expired:{k:'amber',i:'clock',t:'Esta invitación venció',b:v=>'Las invitaciones duran 7 días. Pídele a <b>'+esc(v.inviter)+'</b> que te envíe una nueva.',a:[['Probar otro código','toCode',''],['Volver a la puerta','toGate','ghost']]},
 used:{k:'sky',i:'check',t:'Esta invitación ya se usó',b:v=>'Otra cuenta ya aceptó este código. Si eres tú, inicia sesión con el mismo proveedor que usaste.',a:[['Iniciar sesión','toGate',''],['Probar otro código','toCode','sec']]},
 revoked:{k:'err',i:'ban',t:'Esta invitación fue revocada',b:v=>'<b>'+esc(v.inviter)+'</b> la canceló. Si crees que es un error, habla con esa persona.',a:[['Probar otro código','toCode','sec'],['Volver a la puerta','toGate','ghost']]},
 full:{k:'amber',i:'users',t:'La mesa ya está llena',b:v=>esc(v.table)+' tiene 9 de 9 lugares (el facilitador cuenta). Pídele a '+esc(v.inviter)+' que libere un lugar.',a:[['Volver a la puerta','toGate','']]},
 linked:{k:'err',i:'link',t:'Esa cuenta ya está vinculada a otro miembro',b:()=>'Tu cuenta de este proveedor pertenece a otra persona en la plataforma. Usa otra cuenta o pide ayuda a quien te invitó.',a:[['Usar otra cuenta','toPreview',''],['Pedir ayuda por WhatsApp','help','sec']]},
 qrbad:{k:'amber',i:'qr',t:'Ese QR no es una invitación',b:()=>'Escaneaste un código que no es de Gold Roundtables. Intenta de nuevo o escribe el código de 6 caracteres.',a:[['Escanear otra vez','toQr',''],['Escribir el código','toCode','sec']]},
 norole:{k:'sky',i:'user',t:'Todavía no tienes un rol asignado',b:()=>'Tu cuenta existe, pero nadie te ha asignado a una organización o mesa. Cuando ocurra, te avisaremos por correo.',a:[['Tengo un código de invitación','toCode',''],['Cerrar sesión','signoutnow','sec']]},
 deact:{k:'err',i:'lock',t:'Tu cuenta está desactivada',b:()=>'No puedes entrar por ahora. Habla con el coordinador de tu organización o con Casa del Altísimo.',a:[['Contactar soporte','help',''],['Cerrar sesión','signoutnow','ghost']]},
 unknown:{k:'amber',i:'mail',t:'No encontramos tu cuenta',b:()=>'Entraste, pero esta cuenta no está registrada ni tiene invitación. Las cuentas se crean cuando alguien te invita.',a:[['Tengo un código de invitación','toCode',''],['Escanear QR','toQr','sec'],['Cerrar sesión','signoutnow','ghost']]},
 offline:{k:'off',i:'wifioff',t:'Necesitas internet para entrar',b:()=>'El primer inicio de sesión en este teléfono requiere conexión. Después, tu sesión de mesa sigue funcionando sin internet.',a:[['Reintentar','retry',''],['Volver','toGate','ghost']]}};
function vResult(){
 const r=RES[S.result.k],c='var(--'+r.k+')';
 return flow('<div class="res"><div class="big-ic" style="--c:'+c+'">'+ic(r.i,38)+'</div><h1 class="h1">'+r.t+'</h1><p class="sub">'+r.b(S.inv||{})+'</p></div><div style="margin-top:22px">'+r.a.map(a=>'<button class="btn '+a[2]+'" style="margin-top:8px" data-act="'+a[1]+'">'+a[0]+'</button>').join('')+'</div>')}

function prof(){return S.prof}
function perr(){const p=S.prof,e={};if(!p.first.trim())e.first='Escribe tu nombre';if(!p.last.trim())e.last='Escribe tu apellido';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(p.email.trim()))e.email='Revisa el correo (ejemplo: nombre@correo.com)';
 if(p.tel.replace(/\D/g,'').length<7)e.tel='Escribe un teléfono de al menos 7 dígitos';return e}
function field(id,label,val,o){o=o||{};const e=o.err;return '<div class="fld"><label for="'+id+'">'+label+(o.opt?' <i>(opcional)</i>':'')+'</label><input class="inp" id="'+id+'" value="'+esc(val)+'" '+(o.type?'type="'+o.type+'" ':'')+'autocomplete="off"'+(e?' aria-invalid="true" aria-describedby="'+id+'e"':'')+(o.hint?' aria-describedby="'+id+'h"':'')+'>'+(e?'<div class="ferr" id="'+id+'e" role="alert">'+ic('alert',15)+e+'</div>':'')+(o.hint?'<div class="fhint" id="'+id+'h">'+o.hint+'</div>':'')+'</div>'}
function ccsel(id,v){return '<select class="inp" id="'+id+'" aria-label="Código de país">'+CCS.map(c=>'<option value="'+c[0]+'"'+(c[0]===v?' selected':'')+'>'+c[0]+' '+c[1].slice(0,3)+'.</option>').join('')+'</select>'}
function vProfile(){
 const p=S.prof,e=S.profSub?perr():{},pv=PROVS[S.ident.provider],n=Object.keys(e).length;
 return flow('<h1 class="h1">Confirma tu perfil</h1><p class="sub">Tu facilitador ya registró estos datos. Corrígelos si hace falta.</p>'+
 '<div class="card" style="display:flex;gap:10px;align-items:center;margin-top:12px"><span style="width:34px;height:34px;display:grid;place-items:center;background:'+(S.ident.provider==='apple'?'var(--ink);color:var(--bg)':S.ident.provider==='google'?'#fff':'#1763d6')+';border-radius:10px">'+pv.svg+'</span><div style="min-width:0"><div class="kick">Cuenta vinculada</div><b>'+pv.n+'</b> <span class="fhint">'+esc(S.ident.mail)+'</span></div>'+pill('aceptada').replace('Aceptada','Vinculada')+'</div>'+
 (S.apple?msg('info','shield','Ocultaste tu correo con Apple','Para avisos usaremos el correo que registró tu facilitador. Puedes cambiarlo aquí.'):'')+
 (n?msg('err','alert','Revisa '+n+(n>1?' campos':' campo'),'Corrige los marcados en rojo para continuar.'):'')+
 '<form data-form="prof" novalidate><div class="g2">'+field('f_first','Nombre',p.first,{err:e.first})+field('f_last','Apellido',p.last,{err:e.last})+'</div>'+
 field('f_cargo','Cargo',p.cargo,{opt:1})+field('f_email','Correo de contacto',p.email,{err:e.email,type:'email'})+
 '<div class="fld"><label for="f_tel">Teléfono</label><div class="phrow">'+ccsel('f_cc',p.cc)+'<input class="inp" id="f_tel" inputmode="tel" value="'+esc(p.tel)+'"'+(e.tel?' aria-invalid="true" aria-describedby="f_tele"':'')+'></div>'+(e.tel?'<div class="ferr" id="f_tele" role="alert">'+ic('alert',15)+e.tel+'</div>':'')+'<div class="fhint">'+ic('info',13)+' Sin verificar: solo es un dato de contacto, no sirve para entrar.</div></div>'+
 '<button class="btn" style="margin-top:18px" type="submit">Confirmar y entrar</button></form>',{back:'toPreview',title:'Tu perfil',step:3})}

function vWelcome(){const v=S.inv,c=cur();
 return flow('<div class="res"><div class="big-ic" style="--c:var(--lime)">'+ic('check',40)+'</div><h1 class="h1">Listo, '+esc(S.prof.first)+'</h1><p class="sub">Ya tienes lugar en '+esc(v.table||v.org)+' como '+v.role+'.</p></div>'+
 '<div class="card"><div class="check">'+ic('check',18)+'Cuenta de '+PROVS[S.ident.provider].n+' vinculada</div><div class="check">'+ic('check',18)+'Perfil confirmado</div><div class="check">'+ic('check',18)+'Contexto: '+c.role+' · '+esc(c.scope)+'</div></div>'+
 '<button class="btn" style="margin-top:20px" data-act="enter">Entrar a mi mesa</button>')}

function vPicker(){
 return flow('<div class="pickh"><div class="kick">Primer acceso en este teléfono</div><h1 class="h1">¿Con qué rol entras hoy?</h1><p class="sub">Tienes varios roles, '+esc(S.user.name.split(' ')[0])+'. Recordaremos tu elección y podrás cambiar desde el chip de arriba, en cualquier pantalla.</p></div>'+
 ctxs().map(c=>'<button class="pk" data-act="pick" data-id="'+c.id+'">'+av(c.scope,52)+'<span style="flex:1;min-width:0"><small>'+c.role+'</small><b>'+esc(c.scope)+'</b><em>'+c.desc+'</em></span>'+ic('chev',20).replace('<svg','<svg style="transform:rotate(-90deg)"')+'</button>').join('')+
 '<button class="btn ghost" style="margin-top:12px" data-act="signoutnow">'+ic('logout',18)+'No soy '+esc(S.user.name.split(' ')[0])+'</button>')}

/* ----- shell ----- */
function chip(){const c=cur(),many=ctxs().length>1;
 return '<button class="ctxchip'+(many?'':' static')+'" '+(many?'data-act="ctx" aria-haspopup="dialog"':'disabled')+' aria-label="Contexto actual: '+c.role+', '+esc(c.scope)+(many?'. Cambiar':'')+'">'+av(c.scope,38)+'<span class="tx"><small>'+c.role+'</small><b>'+esc(c.scope)+'</b></span>'+(many?ic('chev',16):'')+'</button>'}
function tabs(){const t=[['home','Inicio','home']];if(can().length)t.push(['invite','Invitar','plus'],['invites','Invitaciones','list']);t.push(['account','Cuenta','user']);return t}
function shell(content){
 const tb=tabs();
 return '<div class="shell"><div class="top">'+chip()+'<span class="sp"></span><button class="ibtn" style="border-radius:50%" data-act="nav" data-t="account" aria-label="Mi cuenta">'+av(S.user.name,36)+'</button></div>'+
 '<div class="mainw"><nav class="side" aria-label="Principal">'+tb.map(t=>'<button data-act="nav" data-t="'+t[0]+'"'+((S.tab==='share'?'invite':S.tab)===t[0]?' aria-current="page"':'')+'>'+ic(t[2],20)+t[1]+'</button>').join('')+'<span class="grow"></span><button data-act="signout">'+ic('logout',20)+'Cerrar sesión</button></nav>'+
 '<main class="main" id="main"><div class="in">'+content+'</div></main></div>'+
 '<nav class="bnav" aria-label="Principal">'+tb.map(t=>'<button data-act="nav" data-t="'+t[0]+'"'+((S.tab==='share'?'invite':S.tab)===t[0]?' aria-current="page"':'')+'>'+ic(t[2],22)+t[1]+'</button>').join('')+'</nav></div>'}
function denied(){return '<div class="res" style="margin-top:20px"><div class="big-ic" style="--c:var(--err)">'+ic('lock',38)+'</div><h1 class="h1">No tienes permiso para esto</h1><p class="sub">Como '+cur().role+' no puedes invitar personas. Pídele a tu facilitador o coordinador que lo haga.</p><button class="btn" style="margin-top:18px" data-act="nav" data-t="home">Volver al inicio</button></div>'}
function offState(what){return '<div class="empty"><div class="big-ic" style="--c:var(--off)">'+ic('wifioff',36)+'</div><h2 style="font-size:20px;font-weight:900">'+what+' necesita conexión</h2><p class="sub">Invitaciones y administración solo funcionan en línea. Tu sesión de mesa no se ve afectada.</p><button class="btn sm" style="margin-top:14px" data-act="retry">'+ic('refresh',16)+'Reintentar</button></div>'}

function vHome(){
 const c=cur(),first=S.user.name.split(' ')[0],inv=S.invites,pend=inv.filter(i=>i.st==='pendiente').length;
 let b='<div class="hrow"><div><div class="kick">'+c.role+' · '+esc(c.scope)+'</div><h1 class="pt">Hola, '+esc(first)+'</h1></div></div>';
 if(S.unsynced)b+=msg('warn','sync','1 sesión sin sincronizar en este teléfono','Mesa Esperanza 03 · 3 respuestas guardadas. Se enviarán al conectarte.');
 if(c.role==='Miembro'){const t=S.tables.find(x=>x.n===c.table);
  b+='<div class="card"><div class="kick">Tu mesa</div><h2 style="font-size:22px;font-weight:900;margin:2px 0 10px">'+esc(c.table)+'</h2>'+seats(t,'x')+'<p class="fhint" style="margin-top:10px">Próxima sesión: jueves · 7:00 pm · 30 min</p></div>'+msg('info','info','¿Quieres invitar a alguien?','Pídeselo a tu facilitador. Solo él agrega integrantes a la mesa.')}
 else{
  b+='<div class="stat"><div><b>'+pend+'</b><small>Pendientes</small></div><div><b>'+visible().filter(i=>i.st==='aceptada').length+'</b><small>Aceptadas</small></div><div><b>'+visible().filter(i=>i.st==='vencida').length+'</b><small>Vencidas</small></div></div>';
  if(c.role==='Facilitador'){const t=S.tables.find(x=>x.n===c.table);b+='<div class="card"><div class="kick">'+esc(c.table)+'</div><div style="margin:8px 0">'+seats(t,'inv')+'</div><b>'+(t.used>=t.max?'Mesa llena · 9 de 9':'Quedan '+(t.max-t.used)+' lugares')+'</b></div>'}
  b+='<div style="display:grid;gap:8px;margin-top:14px;max-width:420px"><button class="btn" data-act="nav" data-t="invite">'+ic('plus',20)+'Invitar a alguien</button><button class="btn sec" data-act="nav" data-t="invites">'+ic('list',18)+'Ver invitaciones</button></div>'+msg('info','wifioff','Invitaciones y administración requieren internet','Tu sesión de mesa sigue funcionando sin conexión.')}
 return b}

function initIv(){const c=cur();let org=c.org,role='Miembro';if(c.role==='Administrador')org='Fundación Luz';
 const t=c.table||(S.tables.find(x=>x.org===org)||{}).n;S.iv={first:'',last:'',cargo:'',email:'',cc:'+1 809',tel:'',role,org,table:t};S.ivSub=false}
function ivErr(){const v=S.iv,e={},c=cur();if(!v.first.trim())e.first='Escribe el nombre';if(!v.last.trim())e.last='Escribe el apellido';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v.email.trim()))e.email='Escribe un correo válido';
 else if(S.invites.some(i=>i.email.toLowerCase()===v.email.trim().toLowerCase()&&i.st==='pendiente'))e.email='Ya hay una invitación pendiente para este correo. Reenvíala desde Invitaciones.';
 if(v.tel.replace(/\D/g,'').length<7)e.tel='Escribe un teléfono de al menos 7 dígitos';
 if(!can().includes(v.role))e.role='Tu rol no puede invitar a '+v.role+'s';return e}
function vInvite(){

function verify(val){
 if(!R.online){S.codeErr='Necesitas internet para comprobar el código.';return render()}
 busy('Comprobando código…',650,()=>{
  const c=CODES[val];
  if(!c){S.attempts++;S.codeErr='No encontramos ese código. Revisa letras y números'+(S.attempts<5?' ('+(5-S.attempts)+' intentos restantes).':'.');return render()}
  S.inv=Object.assign({code:val},c);S.codeErr='';
  if(c.st==='vencida')S.result={k:'expired'};else if(c.st==='aceptada')S.result={k:'used'};else if(c.st==='revocada')S.result={k:'revoked'};
  else{const t=S.tables.find(x=>x.n===c.table);if(t&&t.used>=t.max)S.result={k:'full'}}
  S.screen=S.result?'result':'preview';if(S.screen==='preview')toast('Código válido');else render()})}

function signIn(p){
 S.pendProv=p;
 if(!R.online){S.result={k:'offline'};S.screen='result';return render()}
 const n=PROVS[p].n;
 busy('Conectando con '+n+'…',900,()=>{
  if(R.outcome==='cancel'){if(S.inv){return toast('Cancelaste el inicio con '+n+'. No se vinculó nada.')}S.gateMsg={t:'Cancelaste el inicio con '+n,s:'No se hizo ningún cambio. Puedes intentarlo de nuevo.'};S.screen='gate';return render()}
  S.gateMsg=null;
  if(S.inv){
   if(R.outcome==='linked'){S.result={k:'linked'};S.screen='result';return render()}
   S.ident={provider:p,mail:mailFor(p,S.inv)};S.apple=p==='apple'&&R.outcome==='hide';
   S.user={name:S.inv.first+' '+S.inv.last,email:S.inv.email,provider:p};initProf();S.screen='profile';return render()}
  const pe=PERSONA[R.persona];S.ident={provider:p,mail:pe.email||'cuenta@ejemplo.com'};S.user={name:pe.name,email:pe.email,provider:p};S.base=pe.ctx.slice();
  S.apple=p==='apple'&&R.outcome==='hide';
  if(R.persona==='unknown'){S.result={k:'unknown'};S.screen='result';return render()}
  if(R.persona==='deact'){S.result={k:'deact'};S.screen='result';return render()}
  if(!pe.ctx.length){S.result={k:'norole'};S.screen='result';return render()}
  if(pe.ctx.length>1)S.screen='picker';else{S.ctxId=pe.ctx[0];S.screen='app';S.tab='home';}
  render();if(S.screen==='app')toast('Bienvenido, '+pe.name.split(' ')[0])})}

function syncRv(){
